{% extends "blog/base.html" %}
{% block title %}Delete Post{% endblock %}
{% block content %}
<style>
    .delete-wrapper {
        max-width: 480px;
        margin: 60px auto;
        text-align: center;
    }
    .delete-icon {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: #fdeeed;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 24px;
    }
    .delete-wrapper h1 {
        font-size: 1.6rem;
        margin-bottom: 12px;
    }
    .delete-wrapper p {
        color: #6b6b6b;
        font-size: 0.95rem;
        margin-bottom: 32px;
        line-height: 1.6;
    }
    .delete-actions {
        display: flex;
        justify-content: center;
        gap: 12px;
    }
    .delete-btn {
        background: #e74c3c;
        color: #fff;
        border: none;
        padding: 12px 32px;
        border-radius: 20px;
        font-size: 0.95rem;
        font-weight: 500;
        cursor: pointer;
    }
    .delete-btn:hover {
        background: #d63a2a;
    }
    .cancel-btn {
        background: #f4f4f4;
        color: #444;
        border: none;
        padding: 12px 32px;
        border-radius: 20px;
        font-size: 0.95rem;
        font-weight: 500;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
    }
    .cancel-btn:hover {
        background: #eaeaea;
    }
</style>

<div class="delete-wrapper">
    <div class="delete-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#e74c3c" stroke-width="2">
            <path d="M3 6h18"/>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            <path d="M10 11v6"/>
            <path d="M14 11v6"/>
            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
        </svg>
    </div>
    <h1>Delete "{{ post.title }}"?</h1>
    <p>This action is permanent and cannot be undone. The post and all its comments will be removed.</p>
    <form method="post">
        {% csrf_token %}
        <div class="delete-actions">
            <button type="submit" class="delete-btn">Yes, delete it</button>
            <a href="{{ post.get_absolute_url }}" class="cancel-btn">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
